/* ===== 设计：白底 + 深蓝厚涂油画首屏，Apple 式字体排印 ===== */

  --title:#10283F;
  --blue:#1A5C96;
  --blue-deep:#123A5C;
  --mist:#F5F5F7;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{

.wrap{max-width:1024px;margin:0 auto;padding:0 22px}
button{font-family:inherit;cursor:pointer}

.top{padding:14px 0 12px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-tag{font-size:14px;color:var(--muted)}
.top-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.text-btn{background:none;border:0;padding:4px 0;color:var(--blue);font-size:14px;min-height:32px}
.text-btn:hover{text-decoration:underline;text-underline-offset:3px}

  .hero-art{background-position:62% 46%}
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(to top,rgba(4,14,25,.90) 0%,rgba(4,14,25,.58) 32%,rgba(4,14,25,.18) 70%,rgba(4,14,25,.10) 100%),
    linear-gradient(90deg,rgba(4,14,25,.32),rgba(4,14,25,.04));
}
.hero-inner{
  position:relative;z-index:2;
  max-width:1024px;margin:0 auto;
  min-height:330px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:60px 22px 44px;
}
h1{
  margin:0;color:#fff;font-weight:600;
  font-size:clamp(40px,9.4vw,74px);line-height:1.04;letter-spacing:-0.028em;
}
.tagline{margin:14px 0 0;font-size:16px;color:rgba(255,255,255,.68)}

/* ===== 搜索 ===== */
.panel{padding:44px 0 6px}
.label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
.search-row{display:flex;flex-direction:column;gap:12px}
.field{
  display:flex;align-items:center;gap:8px;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:5px 5px 5px 16px;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,92,150,.12)}
.field input{
  flex:1;min-width:0;border:0;background:transparent;
  font-family:inherit;font-size:17px;color:var(--ink);
  padding:11px 0;letter-spacing:0;
}
.field input::placeholder{color:#86868B}
.field input:focus{outline:none}
.solid-btn{
  flex:0 0 auto;background:var(--blue-deep);color:#fff;
  border:1px solid var(--blue-deep);border-radius:9px;
  padding:0 22px;font-size:16px;min-height:44px;
}
.solid-btn:hover{background:var(--blue);border-color:var(--blue)}
.ghost-btn{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;
  color:var(--blue);font-size:16px;padding:14px 18px;min-height:50px;
  transition:background .18s ease,border-color .18s ease;
}
.ghost-btn:hover{background:var(--mist);border-color:#B9B9BE}
.ghost-btn[aria-pressed="true"]{background:var(--mist);color:var(--ink);border-color:#B9B9BE}
.hint{margin:16px 0 0;font-size:14px;color:var(--muted)}

/* ===== 结果 ===== */
.results{padding:36px 0 64px}
.res-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line);
}
.res-title{margin:0;font-size:26px;font-weight:600;letter-spacing:-0.022em;color:var(--title)}
.res-title em{font-style:normal;color:var(--blue)}
.res-count{font-size:14px;color:var(--muted)}

.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:18px 0 6px}
.filter{
  background:#fff;border:1px solid var(--line);border-radius:9px;color:var(--ink);
  font-family:inherit;font-size:14px;padding:9px 10px;min-height:38px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.filter:hover{border-color:#B9B9BE;background:var(--mist)}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filter .num{font-size:12px;color:var(--muted);margin-left:4px}
.filter[aria-pressed="true"] .num{color:rgba(255,255,255,.6)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{
  text-align:left;font-weight:400;font-size:13px;color:var(--muted);
  padding:14px 8px;border-bottom:1px solid var(--hair);white-space:nowrap;
}
tbody td{padding:15px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
tbody td:first-child{font-size:17px;line-height:1.4;word-break:break-word;padding-left:0}
tbody td:last-child{padding-right:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFAFC}
.pname mark{background:none;color:var(--blue);font-weight:600}

.chip{
  display:inline-flex;align-items:baseline;font-size:15px;line-height:1;
  padding:7px 10px;border-radius:8px;white-space:nowrap;letter-spacing:.01em;
}
.chip-big{background:var(--blue-deep);color:#fff}
.chip-small{background:var(--mist);color:var(--ink);border:1px solid var(--hair)}
.side-note{font-size:14px;color:var(--muted);margin-left:6px;white-space:nowrap}

.state{padding:28px 0 8px;color:var(--muted);font-size:16px;line-height:1.7}
.state strong{color:var(--ink);font-weight:600}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.example{
  background:var(--mist);border:1px solid transparent;border-radius:9px;
  color:var(--ink);font-size:14px;padding:8px 13px;min-height:36px;
}
.example:hover{background:#EDEDF0;border-color:var(--line)}
.empty-cell{padding:32px 8px;color:var(--muted);font-size:16px;line-height:1.7}

/* ===== 页脚 ===== */
footer{border-top:1px solid var(--hair);padding:22px 0 40px;font-size:13px;color:var(--muted);line-height:1.9}
footer .src{color:var(--ink)}
footer button{
  background:none;border:0;color:var(--blue);font-size:13px;padding:4px 0;
  text-decoration:underline;text-underline-offset:3px;
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);
  background:rgba(29,29,31,.94);color:#fff;font-size:14px;
  padding:12px 20px;border-radius:12px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;
  max-width:88vw;z-index:20;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  .search-row{flex-direction:row;align-items:stretch}
  .field{flex:1}
  .ghost-btn{width:auto;flex:0 0 auto;padding:0 20px}
  .hero-inner{min-height:420px;padding:96px 22px 60px}
  .filters{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (min-width:900px){
  .hero-inner{min-height:452px;padding:110px 22px 70px}
  h1{font-size:76px}
  .panel{padding-top:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-tag">油封仓储台账</div>
    <div class="top-actions">
      <button class="text-btn" id="resetBtn" type="button" hidden>恢复原始数据</button>
      <button class="text-btn" id="importBtn" type="button">导入我的表格</button>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt">
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-art" aria-hidden="true"></div>
    <div class="hero-inner">
      <h1>麦道科技</h1>
      <p class="tagline">每个油封，都对应一个货架点位</p>
    </div>
  </section>

  <section class="panel">
    <div class="wrap">
      <label class="label" for="q">按商品名称搜索</label>
      <div class="search-row">
        <div class="field">
          <input id="q" type="search" placeholder="输入商品名称，例如 MR20" autocomplete="off" spellcheck="false" enterkeyhint="search">
          <button class="solid-btn" id="searchBtn" type="button">查询</button>
        </div>
        <button class="ghost-btn" id="allBtn" type="button" aria-pressed="false">查看全部商品库存位置</button>
      </div>
      <p class="hint">只按商品名称匹配，支持名称片段。每个商品同时给出货架大位置与小位置。</p>
    </div>
  </section>

  <section class="results">
    <div class="wrap" id="results" aria-live="polite"></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div>麦道科技 · 库存位置查询</div>
    <div>当前数据：<span class="src" id="srcInfo">—</span></div>
    <div>表格更新：点击右上角「导入我的表格」，可上传新的 .xlsx / .csv 台账，数据只保存在本机浏览器，不上传服务器。<button type="button" id="resetLink">恢复成原始表格数据</button></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---- 工具 ---- */
function txt(v){
  if(v === null || v === undefined) return '';
  return String(v).replace(/\u00a0/g,' ').replace(/[\r\n]+/g,' ').replace(/\s+/g,' ').trim();
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function norm(s){
  return String(s == null ? '' : s).normalize('NFKC').toLowerCase().replace(/\s+/g,'');
}
function code(s){
  return txt(s).replace(/[－—–]/g,'-').replace(/\s+/g,'');
}
function order(a, b){ return a.localeCompare(b, 'zh-Hans-CN', {numeric:true}); }

function bigList(){
  const seen = [];
  DATA.forEach(function(r){ if(seen.indexOf(r.big) < 0) seen.push(r.big); });
  return seen.sort(order);
}
function filterData(list, big){
  if(big === '全部') return list;
  return list.filter(function(r){ return r.big === big; });
}
function sorted(list){
  return list.slice().sort(function(a, b){
    const x = order(a.big, b.big);
    if(x) return x;
    return order(a.small, b.small);
  });
}

/* ---- 渲染 ---- */
function chipBig(r){
  const note = r.note ? '<span class="side-note">' + esc(r.note) + '</span>' : '';
  return '<span class="chip chip-big">' + esc(r.big) + '</span>' + note;
}
function nameCell(name, q){
  const n = norm(q);
  if(!n){ return '<span class="pname">' + esc(name) + '</span>'; }
  const hay = norm(name);
  const idx = hay.indexOf(n);
  if(idx < 0 || n.length === 0){ return '<span class="pname">' + esc(name) + '</span>'; }
  // 归一化后位置可能与原文错位，按原文逐字重建
  let start = -1, len = 0;
  for(let i = 0; i + n.length <= name.length; i++){
    if(norm(name.slice(i, i + n.length)).length === n.length && norm(name.slice(i, i + n.length)) === n){
      start = i; len = n.length; break;
    }
    if(norm(name.slice(i)).indexOf(n) === 0){ start = i; len = n.length; break; }
  }
  if(start < 0){ return '<span class="pname">' + esc(name) + '</span>'; }
  return '<span class="pname">' + esc(name.slice(0, start)) + '<mark>' +
    esc(name.slice(start, start + len)) + '</mark>' + esc(name.slice(start + len)) + '</span>';
}

function tableHTML(rows, q){
  if(!rows.length){
    return '<div class="empty-cell">没有找到匹配的商品。可以只输入名称的一部分，比如 <strong>4G</strong>、<strong>32*47</strong>、<strong>福特</strong>。</div>';
  }
  let html = '<div class="table-wrap"><table><colgroup><col style="width:44%"><col style="width:30%"><col style="width:26%"></colgroup>' +
    '<thead><tr><th scope="col">商品名称</th><th scope="col">货架大位置</th><th scope="col">货架小位置</th></tr></thead><tbody>';
  for(let i = 0; i < rows.length; i++){
    const r = rows[i];
    html += '<tr><td>' + nameCell(r.name, q) + '</td><td>' + chipBig(r) + '</td>' +
      '<td><span class="chip chip-small">' + esc(r.small) + '</span></td></tr>';
  }
  return html + '</tbody></table></div>';
}

function headHTML(title, count){
  return '<div class="res-head"><h2 class="res-title">' + title + '</h2>' +
    '<div class="res-count">' + count + '</div></div>';
}

function renderIdle(){
  resultsEl.innerHTML =
    '<div class="res-head"><h2 class="res-title">商品位置查询</h2><div class="res-count">共 ' + DATA.length + ' 条位置记录</div></div>' +
    '<div class="state">输入商品名称后点击「查询」，同时显示该商品的<strong>大位置</strong>与<strong>小位置</strong>。' +
    '<br>不确定名称怎么写，可以直接点下面的例子试试。' +
    '<div class="examples">' +
      '<button class="example" type="button" data-ex="MR20">MR20</button>' +
      '<button class="example" type="button" data-ex="4G64">4G64</button>' +
      '<button class="example" type="button" data-ex="32*47">32*47</button>' +
      '<button class="example" type="button" data-ex="福特">福特</button>' +
    '</div></div>';
}

function doSearch(force){
  const q = $('q').value.trim();
  Q = q;
  if(!q){
    if(force){
      toast('请先输入商品名称，或点击下方「查看全部商品库存位置」');
      $('q').focus();
      return;
    }
    VIEW = 'idle'; render();
    return;
  }
  VIEW = 'search';
  render();
}

function renderSearch(){
  const n = norm(Q);
  let hit = DATA.filter(function(r){ return norm(r.name).indexOf(n) >= 0; });
  const rank = function(r){
    const name = norm(r.name);
    if(name === n) return 0;
    if(name.indexOf(n) === 0) return 1;
    return 2;
  };
  hit.sort(function(a, b){
    const x = rank(a) - rank(b);
    if(x) return x;
    const y = order(a.big, b.big);
    if(y) return y;
    return order(a.small, b.small);
  });
  const title = '「<em>' + esc(Q) + '</em>」的位置';
  resultsEl.innerHTML = headHTML(title, hit.length ? '匹配 ' + hit.length + ' 条' : '没有匹配项') +
    tableHTML(hit, Q);
}

function renderAll(){
  const groups = bigList();
  const base = filterData(DATA, FILTER);
  let chips = '<button class="filter" type="button" data-big="全部" aria-pressed="' + (FILTER === '全部') + '">全部<span class="num">' + DATA.length + '</span></button>';
  for(let i = 0; i < groups.length; i++){
    const g = groups[i];
    const c = DATA.filter(function(r){ return r.big === g; }).length;
    chips += '<button class="filter" type="button" data-big="' + esc(g) + '" aria-pressed="' + (FILTER === g) + '">' +
      esc(g) + '<span class="num">' + c + '</span></button>';
  }
  resultsEl.innerHTML =
    '<div class="res-head"><h2 class="res-title">全部商品库存位置</h2><div class="res-count">共 ' + base.length + ' 条</div></div>' +
    '<div class="filters">' + chips + '</div>' +
    tableHTML(sorted(base), '');
}

function render(){
  if(VIEW === 'search'){ renderSearch(); return; }
  if(VIEW === 'all'){ renderAll(); return; }
  renderIdle();
}
function syncAllBtn(){
  const on = VIEW === 'all';
  const btn = $('allBtn');
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  btn.textContent = on ? '收起全部商品清单' : '查看全部商品库存位置';
}
function renderAllUI(){
  render(); syncAllBtn();
  $('srcInfo').textContent = DATA.length + ' 条 · ' + SOURCE;
  $('resetBtn').hidden = (SOURCE === DEFAULT_SRC);
}

/* ---- 导入表格 ---- */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

function parseCSV(text){
  const rows = [];
  let row = [], cell = '', quoted = false;
  const s = String(text).replace(/\r\n?/g,'\n');
  for(let i = 0; i < s.length; i++){
    const ch = s[i];
    if(quoted){
      if(ch === '"'){
        if(s[i+1] === '"'){ cell += '"'; i++; }
        else quoted = false;
      } else cell += ch;
    } else if(ch === '"'){ quoted = true; }
    else if(ch === ','){ row.push(cell); cell = ''; }
    else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if(cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return [{ name: 'CSV', rows: rows }];
}

function loadScript(url){
  return new Promise(function(resolve, reject){
    const s = document.createElement('script');
    s.src = url; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
async function readXLSX(file){
  if(!window.XLSX){
    await loadScript('https://fastly.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
  }
  const buf = await file.arrayBuffer();
  const wb = window.XLSX.read(buf, { type: 'array' });
  return wb.SheetNames.map(function(n){
    const ws = wb.Sheets[n];
    const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: true });
    return { name: n, rows: rows };
  });
}

const RE_BIG = /^([A-Za-z])\s*-\s*(\d+)\s*(?:[（(]\s*(左|右)侧\s*[）)])?/;
const RE_SMALL = /^\d+-\d+$/;

function parseSheetRows(rawRows){
  const rows = rawRows.map(function(r){
    return (Array.isArray(r) ? r : []).map(function(c){ return txt(c); });
  });
  const recs = [];

  // 形式一：三列表（表头含「商品 / 名称」与「大 / 小位置」）
  let headerAt = -1, cName = -1, cBig = -1, cSmall = -1;
  for(let i = 0; i < Math.min(rows.length, 12); i++){
    const cells = rows[i];
    if(!cells) continue;
    let n = -1, b = -1, m = -1;
    for(let j = 0; j < cells.length; j++){
      const c = cells[j];
      if(!c) continue;
      if(n < 0 && /商品|品名|名称|货?物名称/.test(c)) n = j;
      if(b < 0 && /大位置|大区位|货架大|大区/.test(c)) b = j;
      if(m < 0 && /小位置|小点位|细分|点位/.test(c)) m = j;
    }
    if(n >= 0 && b >= 0 && m >= 0){ headerAt = i; cName = n; cBig = b; cSmall = m; break; }
  }
  if(headerAt >= 0){
    for(let i = headerAt + 1; i < rows.length; i++){
      const r = rows[i] || [];
      const name = txt(r[cName]), big = code(r[cBig]), small = code(r[cSmall]);
      if(!name || !big || !small) continue;
      const mm = big.match(RE_BIG);
      recs.push({
        name: name,
        big: mm ? (mm[1].toUpperCase() + '-' + mm[2]) : big,
        note: mm && mm[3] ? mm[3] + '侧' : '',
        small: small
      });
    }
    return recs;
  }

  // 形式二：货架排布表（大位置行 → 小位置行 → 商品行，可重复多轮）
  let big = '', note = '', smallByCol = {};
  for(let i = 0; i < rows.length; i++){
    const row = rows[i];
    if(!row || !row.length) continue;
    const first = code(row[0]);
    const mm = first.match(RE_BIG);
    if(mm && !RE_SMALL.test(first)){
      big = mm[1].toUpperCase() + '-' + mm[2];
      note = mm[3] ? mm[3] + '侧' : '';
      smallByCol = {};
      continue;
    }
    const filled = row.filter(function(c){ return c; });
    if(!filled.length) continue;
    const allSmall = filled.every(function(c){ return RE_SMALL.test(code(c)); });
    if(allSmall){
      smallByCol = {};
      for(let j = 0; j < row.length; j++){
        if(row[j] && RE_SMALL.test(code(row[j]))) smallByCol[j] = code(row[j]);
      }
      continue;
    }
    if(!big) continue;
    for(let j = 0; j < row.length; j++){
      const val = row[j];
      if(!val || !(j in smallByCol)) continue;
      if(/^顺序/.test(val)) continue;
      recs.push({ name: val, big: big, note: note, small: smallByCol[j] });
    }
  }
  return recs;
}

function extractRecords(sheets){
  let all = [];
  sheets.forEach(function(s){ all = all.concat(parseSheetRows(s.rows)); });
  const seen = {};
  return all.filter(function(r){
    const k = r.name + '\u0001' + r.big + '\u0001' + r.small;
    if(seen[k]) return false;
    seen[k] = 1;
    return true;
  });
}

async function handleFile(file){
  try{
    const lower = file.name.toLowerCase();
    let sheets;
    if(/\.(csv|txt)$/.test(lower)) sheets = parseCSV(await file.text());
    else sheets = await readXLSX(file);
    const recs = extractRecords(sheets);
    if(!recs.length){
      toast('没有识别到商品数据，请检查表格是否含商品名称 / 大位置 / 小位置');
      return;
    }
    DATA = recs;
    SOURCE = file.name;
    FILTER = '全部';
    try{ localStorage.setItem(LS_KEY, JSON.stringify({ name: file.name, rows: recs })); }catch(e){}
    VIEW = 'idle'; Q = '';
    $('q').value = '';
    renderAllUI();
    toast('已载入 ' + recs.length + ' 条记录');
  }catch(err){
    toast('表格读取失败：' + (err && err.message ? err.message : '格式不支持'));
  }
}

function resetData(){
  DATA = RAW_DATA.slice();
  SOURCE = DEFAULT_SRC;
  FILTER = '全部';
  VIEW = 'idle'; Q = '';
  $('q').value = '';
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  renderAllUI();
  toast('已恢复原始数据');
}

/* ---- 事件 ---- */
let qTimer = null;
$('q').addEventListener('input', function(){
  if(qTimer) clearTimeout(qTimer);
  qTimer = setTimeout(function(){
    const v = $('q').value.trim();
    Q = v;
    if(!v){ VIEW = (VIEW === 'all') ? 'all' : 'idle'; }
    else VIEW = 'search';
    render(); syncAllBtn();
  }, 180);
});
$('q').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); if(qTimer) clearTimeout(qTimer); doSearch(true); }
  if(e.key === 'Escape'){ $('q').value = ''; Q = ''; VIEW = 'idle'; render(); syncAllBtn(); }
});
$('searchBtn').addEventListener('click', function(){ if(qTimer) clearTimeout(qTimer); doSearch(true); });
$('allBtn').addEventListener('click', function(){
  if(qTimer) clearTimeout(qTimer);
  if(VIEW === 'all'){
    VIEW = ($('q').value.trim() || Q) ? 'search' : 'idle';
  } else {
    VIEW = 'all';
  }
  render(); syncAllBtn();
});
resultsEl.addEventListener('click', function(e){
  const ex = e.target.closest('[data-ex]');
  if(ex){
    $('q').value = ex.getAttribute('data-ex');
    Q = $('q').value;
    VIEW = 'search';
    render(); syncAllBtn();
    return;
  }
  const f = e.target.closest('.filter');
  if(f){
    FILTER = f.getAttribute('data-big');
    render();
    return;
  }
});
$('importBtn').addEventListener('click', function(){ $('fileInput').click(); });
$('fileInput').addEventListener('change', function(e){
  const f = e.target.files && e.target.files[0];
  if(f) handleFile(f);
  e.target.value = '';
});
$('resetBtn').addEventListener('click', resetData);
$('resetLink').addEventListener('click', resetData);

/* ---- 启动 ---- */
(function init(){
  try{
    const saved = localStorage.getItem(LS_KEY);
    if(saved){
      const obj = JSON.parse(saved);
      if(obj && Array.isArray(obj.rows) && obj.rows.length){
        DATA = obj.rows;
        SOURCE = obj.name || '本地导入的表格';
      }
    }
  }catch(e){}
  renderAllUI();
})();
</script>
